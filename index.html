<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172523">
    <meta name="description" content="Leap the gaps. Keep your feet. A tiny endless runner.">
    <title>GapJump</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="arcade">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="GapJump home">GAP<span>/</span>JUMP</a>
        <div class="best-score">BEST <strong id="bestScore">0000</strong></div>
      </header>

      <section class="game-shell" aria-label="GapJump game">
        <div class="game-topline">
          <span class="run-label"><i></i> ENDLESS RUN</span>
          <div class="score">DISTANCE <strong id="score">0000</strong></div>
        </div>
        <canvas id="game" width="960" height="540" aria-label="A runner jumps between platforms. Activate the button to play."></canvas>
        <div class="game-controls">
          <p id="status" aria-live="polite">Find your rhythm. Mind the gaps.</p>
          <button id="action" type="button">Start run <span aria-hidden="true">↗</span></button>
        </div>
      </section>

      <footer class="footnote">
        <span>SPACE / ↑ / TAP TO JUMP</span>
        <span class="footnote-mark">KEEP MOVING <b>·</b> STAY LIGHT</span>
      </footer>
    </main>
  </body>
</html>
